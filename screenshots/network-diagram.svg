<svg width="800" height="580" viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Lab network diagram</title>
<desc>A VirtualBox host running an isolated internal network called labnet, containing DC01 (Domain Controller), SIEM01 (Splunk), and two planned machines: a Windows client and Kali Linux. Each VM also has a separate NAT adapter for internet access during setup.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="800" height="580" fill="#ffffff"/>

<!-- Internet / NAT -->
<rect x="270" y="14" width="260" height="36" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="1"/>
<text x="400" y="37" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">Internet (NAT — activation / downloads only)</text>
<line x1="400" y1="50" x2="400" y2="70" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- Host machine -->
<rect x="40" y="70" width="720" height="460" rx="16" fill="#fafaf8" stroke="#b4b2a9" stroke-width="1"/>
<text x="60" y="96" font-family="sans-serif" font-size="14" font-weight="600" fill="#2c2c2a">Physical host — VirtualBox (Windows 11)</text>

<!-- labnet internal network -->
<rect x="80" y="120" width="640" height="330" rx="12" fill="#eaf6f1" stroke="#5dcaa5" stroke-width="1"/>
<text x="100" y="144" font-family="sans-serif" font-size="13" font-weight="600" fill="#085041">Internal network: labnet (isolated) — 10.10.10.0/24</text>

<!-- DC01 -->
<rect x="100" y="170" width="140" height="130" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
<text x="170" y="198" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#085041">DC01</text>
<text x="170" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f6e56">Domain Controller</text>
<text x="170" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f6e56">Active Directory, DNS</text>
<text x="170" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#085041">10.10.10.10</text>

<!-- SIEM01 -->
<rect x="260" y="170" width="140" height="130" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
<text x="330" y="198" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#085041">SIEM01</text>
<text x="330" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f6e56">Splunk Enterprise</text>
<text x="330" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f6e56">Log collection</text>
<text x="330" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#085041">10.10.10.20</text>

<!-- Client (planned) -->
<rect x="420" y="170" width="140" height="130" rx="10" fill="#f1efe8" stroke="#888780" stroke-width="1" stroke-dasharray="5 3"/>
<text x="490" y="198" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#444441">Client</text>
<text x="490" y="216" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5f5e5a">(planned)</text>
<text x="490" y="238" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">Windows 10/11</text>
<text x="490" y="258" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">workstation</text>

<!-- Kali (planned) -->
<rect x="580" y="170" width="140" height="130" rx="10" fill="#f1efe8" stroke="#888780" stroke-width="1" stroke-dasharray="5 3"/>
<text x="650" y="198" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#444441">Kali</text>
<text x="650" y="216" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5f5e5a">(planned)</text>
<text x="650" y="238" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">Attacker</text>
<text x="650" y="258" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">machine</text>

<!-- Forwarding arrow DC01 -> SIEM01 -->
<path d="M170 300 L170 400 L330 400 L330 300" fill="none" stroke="#0f6e56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="250" y="416" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">Logs forwarded (Universal Forwarder, port 9997)</text>

<!-- Legend -->
<rect x="100" y="470" width="14" height="14" rx="3" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
<text x="122" y="481" font-family="sans-serif" font-size="12" fill="#2c2c2a">Built</text>
<rect x="190" y="470" width="14" height="14" rx="3" fill="#f1efe8" stroke="#888780" stroke-width="1" stroke-dasharray="4 2"/>
<text x="212" y="481" font-family="sans-serif" font-size="12" fill="#2c2c2a">Planned next</text>
</svg>
